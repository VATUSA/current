; Overrides the base vatusa/php-nginx image's default pool config
; (/etc/php83/php-fpm.d/www.conf). Kept as a full pool definition since FPM
; loads one [www] block per pool name, not a diff/patch.
;
; Changes from the image default:
;   - request_terminate_timeout: was unset (0/off). A worker stuck on a dead
;     upstream connection (e.g. a silently dropped TCP session to the managed
;     MySQL cluster) would block forever. With only 5 workers, a handful of
;     stuck requests wedged the entire pool and there was nothing to force
;     them out — request_terminate_timeout=60 kills a worker stuck past 60s.
;   - pm.max_children: bumped 5 -> 10 -> 24 for headroom, so a few slow/stuck
;     requests don't saturate the whole pool as easily. At 10 the pool was
;     observed pegged at 10/10 busy workers during traffic peaks, which starved
;     the kubelet's health probe on `/` of a worker entirely — the probe timed
;     out, liveness failed, and the pod was SIGKILLed and restarted (30+ restarts
;     in 20h). Reserving capacity so the probe can always be served is the point
;     here; 24 is sized against the pod's memory limit, at roughly 35MB RSS per
;     worker observed in prod (24 * 35MB ~= 840MB, plus ~60MB for nginx/master),
;     so the gitops prod memory limit must stay at or above 1Gi. Note the real
;     ceiling is CPU, not workers: more workers share the same CPU limit rather
;     than adding throughput.
[www]
user = nobody
group = nobody
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 24
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
request_terminate_timeout = 60
